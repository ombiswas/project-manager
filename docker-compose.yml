services:
  mongodb:
    image: mongo:7-jammy
    container_name: taskhub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: project-manager
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/project-manager
      JWT_SECRET: ${JWT_SECRET:-super-secret-taskhub-jwt-token-key-at-least-32-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-placeholder@example.com}
      SMTP_PASS: ${SMTP_PASS:-placeholder}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@example.com}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api-v1
    container_name: taskhub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
